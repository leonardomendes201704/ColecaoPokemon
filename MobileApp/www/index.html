<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cartas" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Minhas Cartas</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f8ff;
      --card: rgba(255, 255, 255, 0.92);
      --text: #0d1733;
      --muted: #7d8496;
      --line: #e7eaf2;
      --shadow: 0 18px 45px rgba(30, 42, 90, 0.10);
      --shadow-soft: 0 10px 24px rgba(30, 42, 90, 0.08);
      --blue: #2563ff;
      --purple: #7758f6;
      --green: #4fb06d;
      --orange: #f6aa24;
      --nav-height: 86px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(121, 91, 255, 0.16), transparent 28%),
        radial-gradient(circle at 90% 20%, rgba(37, 99, 255, 0.12), transparent 30%),
        linear-gradient(180deg, #fbfcff 0%, var(--bg) 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .phone {
      width: min(430px, 100%);
      height: 880px;
      border-radius: 46px;
      padding: 12px;
      background: linear-gradient(145deg, #20232d, #06070a);
      box-shadow: 0 32px 80px rgba(12, 16, 35, 0.26);
      position: relative;
    }

    .screen {
      height: 100%;
      overflow: hidden;
      border-radius: 36px;
      background:
        radial-gradient(circle at 80% 2%, rgba(124, 91, 255, 0.12), transparent 26%),
        radial-gradient(circle at 5% 20%, rgba(37, 99, 255, 0.08), transparent 30%),
        #fbfcff;
      position: relative;
    }

    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 112px;
      height: 34px;
      border-radius: 999px;
      background: #07080b;
      z-index: 20;
      box-shadow: inset 18px 0 20px rgba(255,255,255,0.03);
    }

    .statusbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.02em;
      position: relative;
      z-index: 10;
    }

    .system-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #10131c;
    }

    .signal {
      display: flex;
      gap: 2px;
      align-items: end;
      height: 14px;
    }

    .signal span {
      width: 3px;
      border-radius: 3px;
      background: currentColor;
      display: block;
    }

    .signal span:nth-child(1) { height: 5px; }
    .signal span:nth-child(2) { height: 8px; }
    .signal span:nth-child(3) { height: 11px; }
    .signal span:nth-child(4) { height: 14px; }

    .battery {
      width: 24px;
      height: 12px;
      border: 2px solid currentColor;
      border-radius: 4px;
      position: relative;
    }

    .battery::before {
      content: "";
      position: absolute;
      right: -5px;
      top: 3px;
      width: 3px;
      height: 5px;
      background: currentColor;
      border-radius: 0 2px 2px 0;
    }

    .battery::after {
      content: "";
      position: absolute;
      inset: 2px 8px 2px 2px;
      background: currentColor;
      border-radius: 2px;
    }

    .app {
      height: calc(100% - 58px);
      overflow-y: auto;
      padding: 12px 22px calc(var(--nav-height) + 22px);
      scrollbar-width: none;
    }

    .app::-webkit-scrollbar { display: none; }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #7b69d8;
      background: linear-gradient(135deg, rgba(119, 88, 246, 0.22), rgba(37, 99, 255, 0.10));
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      flex: 0 0 auto;
    }

    .avatar svg { width: 28px; height: 28px; opacity: 0.72; }

    .title {
      font-size: 32px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.06em;
      flex: 0 1 auto;
      text-align: center;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      width: 42px;
      height: 42px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: var(--text);
      position: relative;
      cursor: pointer;
    }

    .icon-btn svg { width: 24px; height: 24px; }

    .notification-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--purple);
      position: absolute;
      top: 8px;
      right: 7px;
      border: 2px solid #fff;
    }

    .stats-card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 24px 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: 22px;
    }

    .stat {
      text-align: center;
      position: relative;
      padding: 0 6px;
    }

    .stat:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 12px;
      right: 0;
      height: 74px;
      width: 1px;
      background: var(--line);
    }

    .stat-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
    }

    .stat-icon svg { width: 29px; height: 29px; }
    .stat-icon.purple { color: var(--purple); background: rgba(119, 88, 246, 0.16); }
    .stat-icon.green { color: var(--green); background: rgba(79, 176, 109, 0.15); }
    .stat-icon.orange { color: var(--orange); background: rgba(246, 170, 36, 0.18); }

    .stat strong {
      display: block;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .stat span {
      display: block;
      color: #4f5669;
      font-size: 14px;
      margin-top: 4px;
    }

    .section-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0 0 16px 2px;
    }

    .collections {
      display: grid;
      gap: 12px;
    }

    .collection-card {
      min-height: 122px;
      border-radius: 22px;
      background: rgba(255,255,255,0.93);
      border: 1px solid rgba(255,255,255,0.72);
      box-shadow: 0 10px 24px rgba(30, 42, 90, 0.08);
      display: grid;
      grid-template-columns: 96px 1fr 52px;
      gap: 16px;
      align-items: center;
      padding: 12px 16px 12px 12px;
    }

    .image-placeholder {
      width: 96px;
      height: 96px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    .image-placeholder::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(135deg, rgba(255,255,255,.45), transparent),
        radial-gradient(circle at 70% 20%, rgba(255,255,255,.70), transparent 24%);
    }

    .image-placeholder svg {
      width: 54px;
      height: 54px;
      opacity: 0.34;
      position: relative;
      z-index: 1;
    }

    .placeholder-purple { color: #7662d8; background: linear-gradient(135deg, #ede7ff, #d8ccff); }
    .placeholder-green { color: #4da66b; background: linear-gradient(135deg, #e9f8ee, #d4efe0); }
    .placeholder-orange { color: #e09c18; background: linear-gradient(135deg, #fff4d9, #ffe1a3); }
    .placeholder-blue { color: #4a8fd8; background: linear-gradient(135deg, #e9f4ff, #cfe5fb); }

    .collection-info {
      min-width: 0;
    }

    .collection-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.045em;
      margin-bottom: 10px;
      line-height: 1.12;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #3f4658;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .progress-meta span:last-child {
      color: var(--blue);
      white-space: nowrap;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e7e9ef;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
    }

    .fill-purple { background: var(--purple); }
    .fill-green { background: var(--green); }
    .fill-orange { background: var(--orange); }
    .fill-blue { background: #5a9ce5; }

    .badge {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      justify-self: end;
    }

    .badge svg { width: 27px; height: 27px; }
    .badge-purple { color: var(--purple); background: rgba(119, 88, 246, 0.14); }
    .badge-green { color: var(--green); background: rgba(79, 176, 109, 0.15); }
    .badge-orange { color: var(--orange); background: rgba(246, 170, 36, 0.16); }
    .badge-blue { color: #5a9ce5; background: rgba(90, 156, 229, 0.15); }

    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--nav-height);
      background: rgba(255,255,255,0.94);
      border-top: 1px solid rgba(231,234,242,0.95);
      border-radius: 28px 28px 0 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 8px 12px 14px;
      box-shadow: 0 -18px 42px rgba(30, 42, 90, 0.10);
      z-index: 30;
    }

    .nav-item {
      border: 0;
      background: transparent;
      display: grid;
      place-items: center;
      gap: 4px;
      color: #252b39;
      font: inherit;
      font-size: 10px;
      cursor: pointer;
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke-width: 2.2;
    }

    .nav-item.active {
      color: var(--purple);
      font-weight: 700;
    }

    .nav-item.disabled {
      color: rgba(37, 43, 57, .36);
      cursor: default;
    }

    @media (max-width: 440px) {
      body { padding: 0; background: #fbfcff; }
      .phone {
        width: 100%;
        height: 100vh;
        border-radius: 0;
        padding: 0;
        background: transparent;
        box-shadow: none;
      }
      .screen { border-radius: 0; }
      .collection-card { grid-template-columns: 96px 1fr 44px; gap: 12px; }
      .title { font-size: 28px; }
      .app { padding-inline: 16px; }
      .statusbar { padding-inline: 24px; }
    }

    @media (max-width: 768px) {
      body {
        display: block;
        padding: 0;
        background: #fbfcff;
      }

      .phone {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        padding: 0;
        background: transparent;
        box-shadow: none;
      }

      .screen {
        min-height: 100dvh;
        border-radius: 0;
      }

      .dynamic-island,
      .statusbar {
        display: none;
      }

      .app {
        height: 100dvh;
        padding-top: max(18px, env(safe-area-inset-top));
        padding-bottom: calc(var(--nav-height) + 18px + env(safe-area-inset-bottom));
      }

      .bottom-nav {
        border-radius: 24px 24px 0 0;
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
      }
    }

    .collection-card {
      border: 0;
      text-align: left;
      cursor: pointer;
    }

    .collection-card:focus-visible {
      outline: 3px solid rgba(37, 99, 255, .32);
      outline-offset: 4px;
    }

    .collection-cover-image {
      overflow: hidden;
      background: #eef2ff;
    }

    .collection-cover-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge strong {
      font-size: 11px;
      letter-spacing: -.02em;
    }
  </style>
</head>
<body>

    <section class="screen">

      <div class="statusbar" aria-hidden="true">
        <span>9:41</span>
        <div class="system-icons">
          <div class="signal"><span></span><span></span><span></span><span></span></div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg>
          <div class="battery"></div>
        </div>
      </div>

      <div class="app">
        <header class="header">
          <h1 class="title">Minhas Cartas</h1>
        </header>

        <section class="stats-card" aria-label="Resumo da coleÃ§Ã£o">
          <article class="stat">
            <div class="stat-icon purple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 3 8 4-8 4-8-4 8-4Z"/>

                <path d="m4 17 8 4 8-4"/>
              </svg>
            </div>

          </article>

          <article class="stat">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>
              </svg>
            </div>
            <strong id="totalColecoes">0</strong>
            <span>Cole&ccedil;&otilde;es</span>

            <div class="stat-icon orange">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="5" width="10" height="14" rx="2" transform="rotate(-10 10 12)"/>

              </svg>
            </div>
            <strong id="totalDuplicadas">0</strong>
            <span>Duplicatas</span>
          </article>
        </section>

        <section class="collections" aria-label="Lista de coleÃ§Ãµes"></section>
      </div>

      <nav class="bottom-nav" aria-label="Navegação principal">
        <button class="nav-item" type="button" aria-label="In&iacute;cio" data-nav="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          <span>In&iacute;cio</span>
        </button>
        <button class="nav-item active" type="button" aria-label="Cole&ccedil;&otilde;es" data-nav="collections">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><rect x="4" y="4" width="12" height="12" rx="2"/></svg>
          <span>Cole&ccedil;&otilde;es</span>
        </button>
        <button class="nav-item" type="button" aria-label="Busca" data-nav="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Busca</span>
        </button>
        <button class="nav-item" type="button" aria-label="Favoritas" data-nav="favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
          <span>Favoritas</span>
        </button>
        <button class="nav-item" type="button" aria-label="Perfil" data-nav="profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Perfil</span>
        </button>
      </nav>
    </section>
  </main>
  <script src="js/app-data.js"></script>
  <script src="js/minhas-cartas.js"></script>
</body>
</html>
