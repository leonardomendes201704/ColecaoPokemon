<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cartas" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Favoritas</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f8ff;
      --card: rgba(255,255,255,.92);
      --text: #0d1733;
      --muted: #7d8496;
      --purple: #7758f6;
      --blue: #2563ff;
      --green: #4fb06d;
      --shadow-soft: 0 14px 30px rgba(30,42,90,.09);
      --nav-height: 86px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 12% 8%, rgba(119,88,246,.16), transparent 32%),
        radial-gradient(circle at 85% 25%, rgba(37,99,255,.11), transparent 30%),
        linear-gradient(180deg, #fbfcff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .phone {
      width: 430px;
      height: 880px;
      border-radius: 48px;
      padding: 12px;
      background: #1c202a;
      box-shadow: 0 32px 80px rgba(12,16,35,.26);
    }

    .screen {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 36px;
      background: var(--bg);
    }

    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 112px;
      height: 34px;
      border-radius: 999px;
      background: #07080b;
      z-index: 4;
    }

    .statusbar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px;
      font-size: 14px;
      font-weight: 800;
    }

    .app {
      height: calc(100% - 44px);
      overflow-y: auto;
      padding: 22px 22px calc(var(--nav-height) + 18px);
    }

    .topbar {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: var(--text);
      background: rgba(255,255,255,.78);
      box-shadow: var(--shadow-soft);
      cursor: pointer;
    }

    .icon-btn svg { width: 22px; height: 22px; }
    .page-title { margin: 0; text-align: center; font-size: 22px; font-weight: 900; letter-spacing: -.04em; }

    .summary-card {
      border-radius: 22px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: var(--shadow-soft);
      padding: 16px;
      margin-bottom: 16px;
    }

    .summary-card strong { display: block; font-size: 28px; line-height: 1; font-weight: 900; }
    .summary-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; font-weight: 800; }

    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .favorite-card {
      position: relative;
      min-height: 232px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,.9);
      box-shadow: var(--shadow-soft);
    }

    .favorite-open {
      width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .favorite-art {
      height: 154px;
      margin: 7px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(119,88,246,.18), rgba(37,99,255,.12));
      color: rgba(13,23,51,.42);
      font-size: 22px;
      font-weight: 900;
    }

    .favorite-art img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .favorite-info { padding: 0 10px 12px; }
    .favorite-number { margin: 0 0 2px; color: var(--muted); font-size: 10px; font-weight: 900; }
    .favorite-name { margin: 0; min-height: 32px; font-size: 12px; line-height: 1.2; font-weight: 900; letter-spacing: -.02em; }
    .favorite-collection { margin: 6px 0 0; color: var(--muted); font-size: 10px; font-weight: 800; }

    .favorite-remove {
      position: absolute;
      left: 12px;
      top: 130px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, #ff5d7d, #7758f6);
      box-shadow: 0 8px 18px rgba(13,23,51,.18);
      cursor: pointer;
    }

    .favorite-remove svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      stroke-width: 2.5;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 48px 18px;
      border-radius: 22px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.8);
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-soft);
    }

    .nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--nav-height);
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(18px);
      border-top: 1px solid rgba(230,233,242,.9);
      border-radius: 30px 30px 36px 36px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      padding: 8px 18px 12px;
      box-shadow: 0 -18px 34px rgba(30,42,90,.08);
      z-index: 30;
    }

    .nav-item {
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #3e4658;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-item svg { width: 24px; height: 24px; stroke-width: 2.2; }
    .nav-item.active { color: var(--purple); }

    .card-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card-modal.is-open { display: flex; }

    .card-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 12, 28, .52);
      backdrop-filter: blur(10px);
    }

    .card-modal-panel {
      position: relative;
      width: min(380px, 100%);
      max-height: min(780px, 92vh);
      overflow-y: auto;
      border-radius: 26px;
      padding: 18px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 28px 80px rgba(4, 8, 22, .38);
    }

    .card-modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(13,23,51,.86);
      color: #fff;
      font-size: 23px;
      line-height: 1;
      cursor: pointer;
    }

    .card-modal-image {
      display: block;
      width: min(100%, 290px);
      max-height: 520px;
      object-fit: contain;
      margin: 8px auto 16px;
      border-radius: 18px;
      box-shadow: 0 18px 42px rgba(13,23,51,.22);
      background: #eef1f8;
    }

    .card-modal-info { text-align: center; }
    .card-modal-number { margin: 0 0 5px; color: var(--muted); font-size: 12px; font-weight: 900; }
    .card-modal-title { margin: 0; font-size: 21px; line-height: 1.12; font-weight: 900; letter-spacing: -.04em; }
    .card-modal-meta { margin: 8px 0 0; color: var(--muted); font-size: 13px; font-weight: 800; }

    @media (max-width: 768px) {
      body { display: block; padding: 0; background: #fbfcff; }
      .phone { width: 100%; height: 100dvh; border-radius: 0; padding: 0; background: transparent; box-shadow: none; }
      .screen { min-height: 100dvh; border-radius: 0; }
      .dynamic-island, .statusbar { display: none; }
      .app {
        height: 100dvh;
        padding-top: max(18px, env(safe-area-inset-top));
        padding-bottom: calc(var(--nav-height) + 18px + env(safe-area-inset-bottom));
      }
      .nav {
        border-radius: 24px 24px 0 0;
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Favoritas">
    <section class="screen">
      <div class="dynamic-island" aria-hidden="true"></div>
      <header class="statusbar" aria-label="Barra de status">
        <span>9:41</span>
        <span aria-hidden="true">&bull;&bull;&bull;</span>
      </header>

      <div class="app">
        <div class="topbar">
          <button class="icon-btn" type="button" aria-label="Voltar" data-nav="collections">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <h1 class="page-title">Favoritas</h1>
          <span aria-hidden="true"></span>
        </div>

        <section class="summary-card" aria-label="Resumo de favoritas">
          <strong data-favorites-count>0</strong>
          <span>Cartas favoritas</span>
        </section>

        <section class="favorites-grid" aria-label="Lista de cartas favoritas"></section>
      </div>

      <nav class="nav" aria-label="Navegação principal">
        <button class="nav-item" type="button" data-nav="home" aria-label="In&iacute;cio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          <span>In&iacute;cio</span>
        </button>
        <button class="nav-item" type="button" data-nav="collections" aria-label="Cole&ccedil;&otilde;es">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><rect x="4" y="4" width="12" height="12" rx="2"/></svg>
          <span>Cole&ccedil;&otilde;es</span>
        </button>
        <button class="nav-item active" type="button" aria-label="Favoritas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
          <span>Favoritas</span>
        </button>
        <button class="nav-item" type="button" data-nav="profile" aria-label="Perfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Perfil</span>
        </button>
      </nav>
    </section>
  </main>
  <script src="../js/app-data.js"></script>
  <script src="../js/favoritos.js"></script>
</body>
</html>
